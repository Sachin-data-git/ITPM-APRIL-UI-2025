<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function getData(){
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    console.log("Data Fetching...");
                },2000)
            })
        }

       async function fetchData(){
            try{

                let result= await getData();
                console.log(result);
            }catch(error){
                console.error(error);
            }
        }
        fetchData();

     
    </script>
</body>
</html>
