<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="border: 1px solid red;">
        <img src="" alt="">
        <h2>Title: </h2>
        <b>id: </b>
        <p>Description : </p>
        <span>Year : </span>


    </div>

    <button onclick="fetchData()">fetchData</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js" integrity="sha512-h9644v03pHqrIHThkvXhB2PJ8zf5E9IyVnrSfZg8Yj8k4RsO4zldcQc4Bi9iVLUCCsqNY0b4WXVV4UB+wbWENA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>

    async function fetchData(){
         const option={
            method:"GET",
            url:'https://imdb-top-100-movies.p.rapidapi.com/',
            headers: {
    'x-rapidapi-key': '4876bfe787mshde69d0b5ecaadfep1ec372jsnf90842f5c188',
    'x-rapidapi-host': 'imdb-top-100-movies.p.rapidapi.com'
  }
        }

        try{
            const response=await axios.request(option);
            console.log(response.data);

            response.data.map((item)=>{
               
                document.querySelector("h2").innerHTML=item.title;
                document.querySelector("b").innerHTML=item.id;
                document.querySelector("p").innerHTML=item.description;
                document.querySelector("span").innerHTML=item.year;
               let image=item.image;
               document.querySelector("img").setAttribute("src",image);
            })
        }
        catch(error){
            console.error(error);
        }
       }
    </script>
</body>
</html>
